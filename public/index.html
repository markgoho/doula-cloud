<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dou.la URL Shortener</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        line-height: 1.6;
      }
      h1 {
        color: #333;
        text-align: center;
      }
      .api-info {
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 4px;
        margin: 2rem 0;
      }
      code {
        background: #e0e0e0;
        padding: 0.2rem 0.4rem;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>dou.la URL Shortener API</h1>
    <div class="api-info">
      <h2>API Usage</h2>
      <p>
        To shorten a URL, send a POST request to <code>/api/shorten</code> with
        the following JSON body:
      </p>
      <pre><code>{
    "longUrl": "https://example.com/your/long/url"
}</code></pre>
      <p>
        The service will return a shortened URL in the format:
        <code>https://dou.la/[shortCode]</code>
      </p>
    </div>
  </body>
</html>
