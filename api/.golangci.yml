version: "2"

run:
  timeout: 5m

linters:
  # Start from the small default set (errcheck, govet, ineffassign,
  # staticcheck, unused) and add linters that catch real bugs, unhandled
  # errors, or missing documentation. Deliberately skip the purely
  # aesthetic linters (wsl, nlreturn, varnamelen, exhaustruct, ...) and the
  # ones that fight idioms already used throughout this codebase
  # (noinlineerr bans `if err := f(); err != nil {...}`; nonamedreturns
  # bans deliberate named returns; err113 demands every error be a
  # pre-declared sentinel, even one-off messages in a dev tool).
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - godot
    - goconst
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    # #773: the gate that keeps the bare-time.Now() count from silently
    # climbing again -- every production call site reads through
    # api/internal/clock's Now(ctx) or an injected clock.Clock instead.
    # A handful of call sites read real wall time on purpose (a CLI
    # startup wait, Stripe's own test-clock deletion deadline, a test
    # helper package); each carries its own //nolint:forbidigo and an
    # inline reason, the same shape the coverage gate's own exceptions
    # take.
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: "read time through clock.Now(ctx) or an injected clock.Clock (api/internal/clock) instead of calling time.Now() directly -- see issue #773"
  exclusions:
    rules:
      # Deferred Close()/Rollback() on response bodies, rows, and
      # read-only test transactions carry no actionable error in tests.
      - path: _test\.go
        linters:
          - errcheck
      # Every _test.go file is free to call time.Now() directly -- #773's
      # count, and this gate, are both about production Go only.
      - path: _test\.go
        linters:
          - forbidigo

# Report every finding, not the default first 50 per linter and first 3
# of a kind (#1409). Moving to Go 1.27 turned on modernize analyzers with
# about 88 findings; the defaults would have shown 9, so a red CI run
# would have been fixed a page at a time. Uncapped, CI and a local run
# both show the whole list.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
