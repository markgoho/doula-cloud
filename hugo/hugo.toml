baseURL = 'https://doula.cloud/'
locale = 'en-us'
title = 'Doula Cloud'

# The Practice pages (#441) are the site's only content, and they carry
# no taxonomy. Without this Hugo publishes empty /categories/ and /tags/
# pages and lists them in the sitemap, which is a crawler and a Stripe
# reviewer being pointed at nothing.
disableKinds = ['taxonomy', 'term']
