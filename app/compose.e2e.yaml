services:
  # The only piece of the e2e stack still worth containerizing: a pinned
  # Postgres version, rather than whatever the runner happens to have
  # preinstalled. Migrations, the app_e2e login role, and the Go BFF
  # itself all run as host processes now (see app/e2e/stack.ts) -- they're
  # plain Go binaries with no OS dependency worth a container, and running
  # them as host processes skips a cold `go build` inside a container on
  # every CI run entirely (the Go build cache, warmed by actions/setup-go
  # in ci.yml, makes an unchanged compile nearly free).
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '15432:5432'
