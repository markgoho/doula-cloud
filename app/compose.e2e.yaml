services:
  # The only piece of the e2e stack still worth containerizing: a pinned
  # Postgres version, rather than whatever the runner happens to have
  # preinstalled. Migrations, the app_e2e login role, and the Go BFF
  # itself all run as host processes now (see app/e2e/stack.ts) -- they're
  # plain Go binaries with no OS dependency worth a container, and running
  # them as host processes skips a cold `go build` inside a container on
  # every CI run entirely (the Go build cache, warmed by actions/setup-go
  # in ci.yml, makes an unchanged compile nearly free).
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '${DB_HOST_PORT:-15432}:5432'
    # A named volume, not the postgres image's own anonymous one: an
    # anonymous volume is tied to its container's lifetime, so `compose
    # down` (which removes the container) orphans it even without `-v`,
    # and the next `up -d` gets a fresh, empty one -- a simulation run's
    # own resume path (#779, e2e/stack.ts's stopStack) needs `down` alone
    # to actually keep the data. `down -v` still removes this named volume
    # exactly as it removed the anonymous one, so every other spec's
    # ordinary teardown is unchanged.
    volumes:
      - db-data:/var/lib/postgresql/data

  # The object store the BFF writes signed Contract PDFs and message
  # attachments to. Containerized for the same reason `db` is: a pinned
  # image beats whatever the runner has, and there is no host-process
  # equivalent worth running. Held in memory -- `down -v` between runs is
  # the whole cleanup story, and no run should ever depend on an object a
  # previous one left behind.
  #
  # `-external-url` has to match the address the Go SDK is pointed at
  # (STORAGE_EMULATOR_HOST in e2e/stack.ts's startAPI), because it is what
  # fake-gcs-server puts in the Location header of a resumable upload --
  # get it wrong and a large enough upload follows a redirect to a host
  # that does not exist.
  gcs:
    image: docker.io/fsouza/fake-gcs-server:1.52.2
    # -external-url has to track ${GCS_HOST_PORT}, not the fixed 14443 --
    # it's what fake-gcs-server puts in a resumable upload's Location
    # header, and a worktree's shifted host port means a mismatch there
    # would send that redirect nowhere.
    command: ['-scheme', 'http', '-port', '4443', '-backend', 'memory', '-external-url', 'http://127.0.0.1:${GCS_HOST_PORT:-14443}']
    ports:
      - '${GCS_HOST_PORT:-14443}:4443'

volumes:
  # Compose namespaces this by project name (COMPOSE_PROJECT in
  # e2e/stack.ts), so two worktrees' stacks never share one.
  db-data:
