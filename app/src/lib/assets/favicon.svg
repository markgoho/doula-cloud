<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 76 202 94" fill="none" stroke-width="14" stroke-linecap="round">
	<!--
		The Doula Cloud mark (#452), the same three arcs CloudMark.svelte
		draws.

		Literal colours rather than the tokens, because a favicon is rendered
		outside the document and can reach no custom property. Still OKLCH,
		and still the exact values from tokens.css: --color-outline-variant,
		--color-primary-hover and --color-primary, in both themes. Copied
		rather than converted, so there is no second colour space in the repo
		to keep in step.
	-->
	<style>
		.back { stroke: oklch(83.1% 0.026 346); }
		.middle { stroke: oklch(49.9% 0.121 339); }
		.front { stroke: oklch(41.2% 0.119 339); }

		@media (prefers-color-scheme: dark) {
			.back { stroke: oklch(40% 0.024 346); }
			.middle { stroke: oklch(90% 0.08 341); }
			.front { stroke: oklch(84% 0.116 341); }
		}
	</style>
	<path class="back" d="M100 160a32 32 0 0 1 64 0" />
	<path class="middle" d="M78 160a54 54 0 0 1 104.61-18.82 22 22 0 0 1 33.39 18.82" />
	<path class="front" d="M56 160a76 76 0 0 1 137.97-44 44 44 0 0 1 44.03 44" />
</svg>
