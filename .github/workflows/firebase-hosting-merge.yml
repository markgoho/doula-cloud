name: Deploy Hugo site to Firebase Hosting on merge
on:
  push:
    branches:
      - trunk
    paths:
      - "hugo/**"
      - "firebase.json"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: bun install

      - name: Build Hugo site
        run: bun run build

      - name: Upload Hugo build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hugo-public
          path: hugo/public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Hugo build artifacts
        uses: actions/download-artifact@v8
        with:
          name: hugo-public
          path: hugo/public

      - name: Deploy to Firebase
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOULA_CLOUD }}
          channelId: live
          projectId: doula-cloud

      - name: Retry deploy to Firebase
        if: steps.deploy.outcome == 'failure'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOULA_CLOUD }}
          channelId: live
          projectId: doula-cloud
