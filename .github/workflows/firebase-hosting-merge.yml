name: Deploy Hugo site to Firebase Hosting on merge
on:
  push:
    branches:
      - trunk
    paths:
      - "hugo/**"
      - "firebase.json"
      # The site is no longer only the files under hugo/: #441's
      # pre-build step generates a page per published Practice, so the
      # generator and the script that runs it are site sources too.
      - "scripts/practice-page.ts"
      - "scripts/sync-practice-pages.ts"
      - "package.json"
      - ".github/workflows/firebase-hosting-merge.yml"
  # A Practice publishing her page (#441) produces no commit, so no push
  # trigger can ever see it. The BFF fires this event instead, from a
  # queued rebuild (#443) -- one named type, so the workflow answers to
  # this and to nothing else anyone might send.
  repository_dispatch:
    types: [practice-page-published]

permissions:
  contents: read
  id-token: write
  packages: read

# No cancel-in-progress -- this is a live-site deploy, and two quick
# hugo/** pushes must apply in order, not have the first one cancelled
# mid-deploy by the second. (ci.yml's push-triggered jobs now make the
# same choice, after confirming experimentally that a job's own
# concurrency group doesn't protect it from a cancel-in-progress: true
# set anywhere in the same run.)
#
# The same holds for a dispatched rebuild: #443's worker already
# collapses queued rebuilds into one dispatch, so a second run arriving
# here is a real second change and not a duplicate to discard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository }}:trunk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: bun install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      # Same download and retry as ci.yml's migrate job -- Google's
      # storage bucket rather than a GitHub release asset, because the
      # shared-runner download path is flaky.
      - name: Install cloud-sql-proxy
        run: |
          for attempt in 1 2 3; do
            if curl -o /usr/local/bin/cloud-sql-proxy -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.25.2/cloud-sql-proxy.linux.amd64; then
              chmod +x /usr/local/bin/cloud-sql-proxy
              exit 0
            fi
            echo "cloud-sql-proxy install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Fetch the site builder DSN
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            dsn:doula-cloud/doula-cloud-pg-site-builder-dsn

      # SYNC_PRACTICE_PAGES=required is what makes an unreachable
      # database fail this job instead of quietly building a site with no
      # Practice pages in it. A failed build uploads no artifact, the
      # deploy job never runs, and the live pages -- whose URLs Stripe
      # holds under an ongoing review (#382) -- stay exactly as they were.
      - name: Build Hugo site
        env:
          SITE_BUILDER_DSN: ${{ steps.secrets.outputs.dsn }}
        run: |
          # --health-check publishes /readiness on --http-port, which is
          # the proxy's own answer to "are you listening yet". Asked with
          # curl rather than a bash /dev/tcp redirect: this step runs
          # under `sh -e` (the container image sets no default shell), and
          # sh has no /dev/tcp at all -- so the redirect could never
          # succeed and the wait was decided by the timeout every run.
          cloud-sql-proxy --port 5432 --health-check --http-address 127.0.0.1 --http-port 9090 \
            doula-cloud:us-central1:doula-cloud-pg &
          proxy_pid=$!
          trap 'kill "${proxy_pid}"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:9090/readiness > /dev/null; then break; fi
            if [ "${attempt}" -eq 30 ]; then
              echo "cloud-sql-proxy never reported ready"
              exit 1
            fi
            sleep 1
          done
          # The secret is postgres://user:pass@_/dbname, the same shape
          # ci.yml's migrate DSN has: the host in it is a placeholder,
          # because the only reachable address is the proxy on localhost.
          without_scheme="${SITE_BUILDER_DSN#postgres://}"
          userpass="${without_scheme%%@*}"
          rest="${without_scheme#*@}"
          db_name="${rest##*/}"
          export SYNC_PRACTICE_PAGES=required
          export DATABASE_URL="postgres://${userpass}@127.0.0.1:5432/${db_name%%\?*}?sslmode=disable"
          bun run build

      - name: Upload Hugo build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hugo-public
          path: hugo/public
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Hugo build artifacts
        uses: actions/download-artifact@v8
        with:
          name: hugo-public
          path: hugo/public

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - uses: oven-sh/setup-bun@v2

      - name: Deploy to Firebase
        run: bunx firebase-tools deploy --only hosting:hugo --non-interactive

      # #443: prove each published page resolves, and mark the Practice
      # when it does not.
      #
      # One POST rather than a curl loop over the pages, because the BFF
      # already knows every slug and has to write the result somewhere
      # this workflow cannot reach -- the site builder role reads five
      # tables and writes nothing, deliberately (00046). The probe is one
      # Go function, shared with the Cloud Scheduler sweep that covers
      # what this step cannot: a build that fails never gets here at all.
      - name: Fetch the site worker secret
        id: worker
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            secret:doula-cloud/doula-cloud-notification-worker-secret

      # The raw Cloud Run URL, the same one Cloud Tasks targets, rather
      # than going in through Firebase Hosting's /api/** rewrite: this
      # endpoint is not the app's, and the rewrite strips headers this
      # request is authenticated by (#138).
      - name: Confirm every published page resolves
        env:
          WORKER_SECRET: ${{ steps.worker.outputs.secret }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 120 \
            -X POST "https://doula-api-850855848778.us-central1.run.app/api/internal/site/verify-pages" \
            -H "X-Internal-Secret: ${WORKER_SECRET}"
