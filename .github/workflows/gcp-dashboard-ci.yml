name: gcp-dashboard CI

# gcp-dashboard/ is a personal, local-only tool -- never deployed anywhere
# -- so this workflow only ever lints, typechecks, builds and tests it. It
# stays out of ci.yml (and off the trunk ruleset's required-checks list,
# per docs/agents/worktree-flow-reference.md) the same way the Firebase preview
# workflows do: a standalone workflow gated by its own `paths:` filter, so
# it runs only when this directory actually changes.
on:
  push:
    branches: [trunk]
    paths:
      - "gcp-dashboard/**"
      - ".github/workflows/gcp-dashboard-ci.yml"
  pull_request:
    paths:
      - "gcp-dashboard/**"
      - ".github/workflows/gcp-dashboard-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 20 minutes holds the Playwright install steps' worst case, 16 minutes;
    # the arithmetic is on ci.yml's `app` job (#1661).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-gcp-dashboard-${{ runner.os }}-${{ hashFiles('gcp-dashboard/bun.lock') }}
          restore-keys: bun-gcp-dashboard-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: gcp-dashboard/node_modules
          key: node-modules-gcp-dashboard-${{ runner.os }}-${{ hashFiles('gcp-dashboard/bun.lock') }}

      - name: Install dependencies
        working-directory: gcp-dashboard
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: gcp-dashboard
        run: bun run check

      - name: Lint
        working-directory: gcp-dashboard
        run: bun run lint

      # The `client` project (vite.config.ts) runs the dashboard page's specs
      # in headless Chromium via @vitest/browser-playwright -- the same
      # mechanism app/'s ci.yml installs for its own `client` project.
      # --only-shell installs chromium-headless-shell rather than full
      # Chromium, which this headless-only run never needs. Adds roughly
      # 30-60s to a cold job even with the cache below (~90MB download);
      # every run, hit or miss, pays the OS-dependency install step.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: gcp-dashboard
        run: |
          version=$(grep -oP '"playwright@\K[0-9.]+(?=")' bun.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-gcp-dashboard-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # See the comment on the step of the same name in ci.yml (#1667).
      - name: Cache Playwright OS packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ steps.playwright-version.outputs.image }}-${{ steps.playwright-version.outputs.version }}

      # See the comment on the `app` job's step of the same name in ci.yml
      # (#1655, #1661). It also holds the job-timeout arithmetic for both steps.
      - name: Install Playwright OS dependencies
        working-directory: gcp-dashboard
        run: bash ../scripts/install-playwright-deps.sh

      # See the comment on the `app` job's step "Install Playwright browsers"
      # in ci.yml (#1661).
      - name: Install Playwright browser
        working-directory: gcp-dashboard
        run: |
          for attempt in 1 2 3; do
            if timeout 120 bunx playwright install --only-shell chromium; then
              exit 0
            fi
            echo "Browser install attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          exit 1
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Unit test with coverage gate
        working-directory: gcp-dashboard
        run: bun run test:unit:coverage

      - name: Build
        working-directory: gcp-dashboard
        run: bun run build
