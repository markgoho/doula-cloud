name: Deploy app to Firebase Hosting on merge
on:
  push:
    branches:
      - trunk
    paths:
      - "app/**"
      - "firebase.json"

permissions:
  contents: read
  id-token: write
  packages: read

# No cancel-in-progress, mirrors firebase-hosting-merge.yml's hugo job --
# a live-site deploy, so two quick app/** pushes must apply in order, not
# have the first one cancelled mid-deploy by the second.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build app
        working-directory: app
        run: bun run build

      - name: Upload app build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download app build artifacts
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - uses: oven-sh/setup-bun@v2

      - name: Deploy to Firebase
        run: bunx firebase-tools deploy --only hosting:app --non-interactive
