name: Deploy app to Firebase Hosting on PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "app/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-app-pull-request.yml"

permissions:
  checks: write
  contents: read
  id-token: write
  packages: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build app
        working-directory: app
        run: bun run build

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - name: Deploy to Firebase preview channel
        id: firebase_hosting_preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        # `--json` sends the command's ERROR to stdout as well as its
        # result, and stdout is a file nothing reads on the failure path
        # -- so when the site hit Firebase's fifty-channel cap on
        # 2026-09-04 the log said `exit code 1` and not one word more
        # (#736). Hence the explicit failure branch: the output is the
        # only account of what went wrong, so it goes to the log before
        # the step gives up.
        #
        # `--expires 3d` rather than 7d is the backstop half of #736.
        # The primary release is now firebase-hosting-preview-cleanup.yml
        # on PR close, so a channel normally outlives its PR by seconds;
        # this only bounds how long a MISSED release lingers. Three days
        # against roughly twelve PRs a day settles near thirty-six
        # channels, inside the cap of fifty, where seven days settled
        # near eighty-four -- past it, which is the failure this ticket
        # is about.
        run: |
          if ! bunx firebase-tools hosting:channel:deploy "pr-${PR_NUMBER}" \
            --only app --expires 3d --non-interactive --json > deploy-output.json; then
            echo "::error::firebase hosting:channel:deploy failed. Its output follows."
            cat deploy-output.json
            exit 1
          fi
          url=$(bun -e "console.log(Object.values(require('./deploy-output.json').result)[0].url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.firebase_hosting_preview.outputs.url }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('App Preview Deployment')
            );

            const commentBody = [
              '## App Preview Deployment',
              '',
              '**Preview URL**: ' + process.env.PREVIEW_URL,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
