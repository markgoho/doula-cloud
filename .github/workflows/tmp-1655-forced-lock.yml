# TEMPORARY (#1655): forces the real condition to prove the retry recovers.
# A root apt-get started before the run holds the dpkg lock; attempt 1
# hangs and is ended by `timeout`; attempt 2 is the real
# `playwright install-deps`. Removed before merge.
name: tmp-1655-forced-lock
on:
  push:
    branches: [fix/1655-playwright-deps-retry]
permissions:
  contents: read
jobs:
  new-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Start a root apt-get that holds the dpkg lock for ~200s
        run: |
          # shellcheck disable=SC2024 # the log file is the runner's on purpose
          sudo setsid -f apt-get install -y --no-install-recommends -o 'DPkg::Pre-Invoke::=sleep 200' fonts-ipafont-gothic >"$RUNNER_TEMP/orphan.log" 2>&1
          sleep 5
          sudo fuser -v /var/lib/dpkg/lock-frontend || true
      - name: Run the script (attempt 1 times out holding the lock)
        working-directory: app
        env:
          ATTEMPT_TIMEOUT: "60"
        run: |
          # Attempt 1 hangs and is ended by the timeout; the lock holder
          # started above is a root process the timeout cannot reach.
          INSTALL_CMD='if [ ! -e "$RUNNER_TEMP/a1" ]; then touch "$RUNNER_TEMP/a1"; sleep 600; fi; bunx playwright install-deps chromium' bash ../scripts/install-playwright-deps.sh
      - name: Show the end state
        run: |
          pgrep -a -x 'apt-get|apt|dpkg' || echo "no apt process left"
          dpkg -s fonts-ipafont-gothic | head -3
          cat "$RUNNER_TEMP/orphan.log" | tail -5
  old-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Start a root apt-get that holds the dpkg lock for ~200s
        run: |
          # shellcheck disable=SC2024 # the log file is the runner's on purpose
          sudo setsid -f apt-get install -y --no-install-recommends -o 'DPkg::Pre-Invoke::=sleep 200' fonts-ipafont-gothic >"$RUNNER_TEMP/orphan.log" 2>&1
          sleep 5
          sudo fuser -v /var/lib/dpkg/lock-frontend || true
      - name: Run the OLD loop (expected to fail on the lock)
        working-directory: app
        id: old
        continue-on-error: true
        run: |
          # shellcheck disable=SC2016 # the quotes keep the command for bash -c
          for attempt in 1 2 3; do
            if timeout 60 bash -c 'if [ ! -e "$RUNNER_TEMP/a1" ]; then touch "$RUNNER_TEMP/a1"; sleep 600; fi; bunx playwright install-deps chromium'; then
              exit 0
            fi
            echo "OS dependency install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1
      - name: Record the old loop's outcome
        run: echo "old loop outcome ${{ steps.old.outcome }}"
