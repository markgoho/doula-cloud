name: Deploy the marketing site to Firebase Hosting on PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "site/**"
      - "app/src/lib/styles/**"
      - "firebase.json"
      # As on the merge workflow. The preview build has no database
      # credential and SYNC_PRACTICE_PAGES is unset here on purpose, so
      # a preview shows the site without Practice pages rather than a
      # stale copy of them.
      - "scripts/sync-practice-pages.ts"
      - "package.json"
      - ".github/workflows/firebase-hosting-pull-request.yml"

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Build the site
        run: bun run build

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - name: Deploy to Firebase preview channel
        id: firebase_hosting_preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        # As on the app workflow, and for the same reason (#736):
        # `--json` puts the command's error on stdout, which is a file
        # nothing reads when the step fails, so the log said `exit code
        # 1` and nothing else the day the app site hit Firebase's
        # fifty-channel cap. This site has not hit it, but it creates
        # channels exactly the same way and would.
        run: |
          if ! bunx firebase-tools hosting:channel:deploy "pr-${PR_NUMBER}" \
            --only site --expires 3d --non-interactive --json > deploy-output.json; then
            echo "::error::firebase hosting:channel:deploy failed. Its output follows."
            cat deploy-output.json
            exit 1
          fi
          url=$(bun -e "console.log(Object.values(require('./deploy-output.json').result)[0].url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.firebase_hosting_preview.outputs.url }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Site Preview Deployment')
            );

            const commentBody = [
              '## Site Preview Deployment',
              '',
              '**Preview URL**: ' + process.env.PREVIEW_URL,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
