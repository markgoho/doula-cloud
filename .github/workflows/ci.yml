name: CI

on:
  push:
    branches: [trunk]
  pull_request:

# A new push to the same branch/PR cancels whatever CI run is still in
# flight for it, so trunk pushed in quick succession (e.g. a fix-up
# commit) don't queue up redundant runs of a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Lint workflows
        run: ./actionlint

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Docker ships preinstalled and running on ubuntu-latest, so
      # testcontainers-go (internal/testdb) needs no setup here -- it
      # falls back to Docker's default socket when DOCKER_HOST is unset.
      # Local dev instead points DOCKER_HOST at a Podman socket (see
      # docs/testing.md); internal/testdb itself is engine-agnostic.

      - name: Check formatting
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "The files above are not gofmt-formatted. Run 'gofmt -w' on them."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api

      # The testdb harness (internal/testdb) starts a real Postgres
      # container and applies the goose migrations against it — this is
      # the CI-provable half of "goose is set up for api/" (see
      # scripts/migrate.sh for the Cloud SQL Auth Proxy half, which needs
      # a real instance CI doesn't have).
      #
      # go-test-action runs `go test -json` itself and renders the result
      # as a per-package job summary with failures annotated inline --
      # mirroring the Vitest job summary the app job already gets for
      # free from Vitest's built-in GitHub Actions reporter. -coverprofile
      # is passed through testArguments so coverage.out is produced
      # exactly as before for the covcheck gate below; `cover: true` just
      # tells the action to render the coverage column (it detects the
      # -coverprofile flag already in testArguments and skips appending
      # its own -cover, per the action's docs). -json only changes how
      # `go test`'s own output is framed; it isn't one of the flags
      # forwarded to the test binary that Go's test cache keys on
      # (-coverprofile is on that cacheable list), so cached results from
      # unchanged packages still short-circuit as before.
      - name: Test
        uses: robherley/go-test-action@v1
        with:
          moduleDirectory: api
          testArguments: '-coverprofile=coverage.out ./...'
          cover: true

      - name: Enforce 100% line coverage
        working-directory: api
        run: go run ./tools/covcheck -profile=coverage.out -module=doula-cloud/api -skip=doula-cloud/api/tools/

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # e2e/stack.ts's compose stack: `docker compose` ships preinstalled on
    # ubuntu-latest and needs no rootless-socket setup or external compose
    # provider, unlike this runner's Podman (see e2e/stack.ts and
    # compose.e2e.yaml for what that combination broke). Local dev keeps
    # defaulting to Podman -- see docs/testing.md.
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # app/node_modules is cached directly (measured ~91s cold install,
      # ~2s on a cache hit), not just the bun tarball cache above -- 637
      # packages of extract-and-link is what dominates a cold install on
      # this 2 vCPU runner, and the tarball cache alone doesn't remove
      # that step. No restore-keys: a miss falls through to a clean cold
      # install, never a stale tree.
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: bun run check

      - name: Lint
        working-directory: app
        run: bun run lint

      # Keyed on the resolved @playwright/test version, not
      # hashFiles('app/bun.lock') -- any unrelated dep bump changes that
      # hash and throws away the cache entry for no reason. No
      # restore-keys fallback: a stale-version hit would pair old browser
      # binaries with the install-deps-only branch below. The key carries
      # a "shell" tag because it caches chromium-headless-shell only (see
      # the install step below), not the full Chromium browser -- reusing
      # the old "playwright-" key would silently serve stale full-browser
      # cache entries from before this switch.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: app
        run: |
          version=$(grep -oP '"@playwright/test@\K[0-9.]+(?=")' bun.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --only-shell installs chromium-headless-shell instead of full
      # Chromium -- roughly half the download/cache size. Headless runs
      # (both Playwright e2e and the vitest browser tests, see
      # vite.config.ts) use the headless shell by default and neither
      # pins a `channel:`, so the full browser is never actually needed.
      # Retried with a 30s gap: cdn.playwright.dev intermittently 403s
      # runner IPs with a geo-block ("not available in your location"),
      # and Playwright's own 3 retries fire within seconds of each other,
      # too fast for the CDN edge to recover.
      - name: Install Playwright browsers
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if bunx playwright install --with-deps --only-shell chromium; then
              exit 0
            fi
            echo "Browser install attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          exit 1
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # On a cache hit the headless shell binary is already restored, but
      # the OS-level libraries it links against live outside the cached
      # path and still need installing on every fresh runner.
      - name: Install Playwright OS dependencies only
        working-directory: app
        run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Unit test with coverage gate
        working-directory: app
        run: bun run test:unit:coverage

      - name: E2e test
        working-directory: app
        run: bunx playwright test
        timeout-minutes: 10

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
