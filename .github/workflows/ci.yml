name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Podman ships on the ubuntu-latest runner but its rootless socket
      # needs to be started explicitly, and testcontainers-go's Ryuk reaper
      # is unreliable under rootless Podman, so it's disabled.
      - name: Start Podman socket
        run: |
          systemctl --user start podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: api

      # The testdb harness (internal/testdb) starts a real Postgres
      # container and applies the goose migrations against it — this is
      # the CI-provable half of "goose is set up for api/" (see
      # scripts/migrate.sh for the Cloud SQL Auth Proxy half, which needs
      # a real instance CI doesn't have).
      - name: Test
        working-directory: api
        run: go test ./... -coverprofile=coverage.out

      - name: Enforce 100% line coverage
        working-directory: api
        run: go run ./tools/covcheck -profile=coverage.out -module=doula-cloud/api -skip=doula-cloud/api/tools/

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Podman ships on the runner but its rootless socket needs to be
      # started explicitly before `podman compose` can reach it.
      - name: Start Podman socket
        run: |
          systemctl --user start podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"

      - name: Install podman-compose
        run: pipx install podman-compose

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: bun run check

      - name: Lint
        working-directory: app
        run: bun run lint

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: app
        run: bunx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies only
        working-directory: app
        run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Unit test with coverage gate
        working-directory: app
        run: bun run test:unit:coverage

      - name: E2e test
        working-directory: app
        run: bunx playwright test
        timeout-minutes: 5
