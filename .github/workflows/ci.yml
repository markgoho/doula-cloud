name: CI

on:
  push:
    branches: [trunk]
  pull_request:

# A new push to the same branch/PR cancels whatever CI run is still in
# flight for it, so trunk pushed in quick succession (e.g. a fix-up
# commit) don't queue up redundant runs of a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Retried with a 10s gap: the download script hits GitHub's API to
      # resolve the release asset, which intermittently 429s shared
      # runner IPs (see the Playwright install step below for the same
      # pattern against a different flaky download).
      - name: Install actionlint
        run: |
          for attempt in 1 2 3; do
            if bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12; then
              exit 0
            fi
            echo "actionlint install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Lint workflows
        run: ./actionlint

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Docker ships preinstalled and running on ubuntu-latest, so
      # testcontainers-go (internal/testdb) needs no setup here -- it
      # falls back to Docker's default socket when DOCKER_HOST is unset.
      # Local dev instead points DOCKER_HOST at a Podman socket (see
      # docs/testing.md); internal/testdb itself is engine-agnostic.

      - name: Check formatting
        working-directory: api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "The files above are not gofmt-formatted. Run 'gofmt -w' on them."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api

      # The testdb harness (internal/testdb) starts a real Postgres
      # container and applies the goose migrations against it — this is
      # the CI-provable half of "goose is set up for api/" (see
      # scripts/migrate.sh for the Cloud SQL Auth Proxy half, which needs
      # a real instance CI doesn't have).
      #
      # go-test-action runs `go test -json` itself and renders the result
      # as a per-package job summary with failing tests called out --
      # mirroring the Vitest job summary the app job already gets for
      # free from Vitest's built-in GitHub Actions reporter. -coverprofile
      # is passed through testArguments so coverage.out is produced
      # exactly as before for the covcheck gate below; `cover: true` just
      # tells the action to render the coverage column (it detects the
      # -coverprofile flag already in testArguments and skips appending
      # its own -cover, per the action's docs).
      #
      # Caveat: -json still lets go test cache successful results (a
      # cache hit for a package now shows up as a lookup with no "save"
      # line rather than a miss+recompute), but it changes the cache key
      # shape versus the old `go test ./... -coverprofile=...` command by
      # forwarding an extra cacheable flag to the test binary. Since
      # actions/setup-go's persisted cache blob is keyed only on go.sum
      # and skips re-saving once it already has a hit, the newly-shaped
      # entries this step computes never make it back into that blob --
      # so, until go.sum next changes and forces a fresh save, every run
      # recomputes all packages here (~70s) instead of hitting the near
      # -instant cache trunk had before this change.
      - name: Test
        uses: robherley/go-test-action@v1
        with:
          moduleDirectory: api
          testArguments: '-coverprofile=coverage.out ./...'
          cover: true

      - name: Enforce 100% line coverage
        working-directory: api
        run: go run ./tools/covcheck -profile=coverage.out -module=doula-cloud/api -skip=doula-cloud/api/tools/

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # e2e/stack.ts's db-only compose stack: `docker compose` ships
    # preinstalled on ubuntu-latest and needs no rootless-socket setup or
    # external compose provider, unlike this runner's Podman (see
    # e2e/stack.ts and compose.e2e.yaml for what that combination broke
    # back when the stack also built/ran Go images through it). Local dev
    # keeps defaulting to Podman -- see docs/testing.md.
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7

      # e2e/stack.ts runs api/cmd/migrate and the Go BFF itself as host
      # processes (`go run`/`go build`) rather than building them into
      # compose images -- this primes the Go toolchain and its build/
      # module cache (~13s warm) so the e2e step below doesn't pay for a
      # cold compile of api/ on every run.
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # app/node_modules is cached directly (measured ~91s cold install,
      # ~2s on a cache hit), not just the bun tarball cache above -- 637
      # packages of extract-and-link is what dominates a cold install on
      # this 2 vCPU runner, and the tarball cache alone doesn't remove
      # that step. No restore-keys: a miss falls through to a clean cold
      # install, never a stale tree.
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: app
        run: bun run check

      - name: Lint
        working-directory: app
        run: bun run lint

      # Keyed on the resolved @playwright/test version, not
      # hashFiles('app/bun.lock') -- any unrelated dep bump changes that
      # hash and throws away the cache entry for no reason. No
      # restore-keys fallback: a stale-version hit would pair old browser
      # binaries with the install-deps-only branch below. The key carries
      # a "shell" tag because it caches chromium-headless-shell only (see
      # the install step below), not the full Chromium browser -- reusing
      # the old "playwright-" key would silently serve stale full-browser
      # cache entries from before this switch.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: app
        run: |
          version=$(grep -oP '"@playwright/test@\K[0-9.]+(?=")' bun.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --only-shell installs chromium-headless-shell instead of full
      # Chromium -- roughly half the download/cache size. Headless runs
      # (both Playwright e2e and the vitest browser tests, see
      # vite.config.ts) use the headless shell by default and neither
      # pins a `channel:`, so the full browser is never actually needed.
      # Retried with a 30s gap: cdn.playwright.dev intermittently 403s
      # runner IPs with a geo-block ("not available in your location"),
      # and Playwright's own 3 retries fire within seconds of each other,
      # too fast for the CDN edge to recover.
      - name: Install Playwright browsers
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if bunx playwright install --with-deps --only-shell chromium; then
              exit 0
            fi
            echo "Browser install attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          exit 1
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # On a cache hit the headless shell binary is already restored, but
      # the OS-level libraries it links against live outside the cached
      # path and still need installing on every fresh runner.
      - name: Install Playwright OS dependencies only
        working-directory: app
        run: bunx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Unit test with coverage gate
        working-directory: app
        run: bun run test:unit:coverage

      - name: E2e test
        working-directory: app
        run: bunx playwright test
        timeout-minutes: 10

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # e2e/stack.ts (see the `app` job above) now runs api/cmd/migrate and
  # the BFF as host processes instead of building them into compose
  # images, so that build no longer proves api/Dockerfile still builds
  # *and boots*. It matters because the runtime image is distroless
  # (gcr.io/distroless/static-debian12) -- a missing CA bundle or tzdata
  # would break the running container even though `go build` and `go
  # test` both pass cleanly, and a compile-only check can't catch that.
  # Runs in parallel with `app`, off the critical path -- it doesn't gate
  # or slow down the e2e run, which no longer touches this image at all.
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          load: true
          tags: doula-cloud-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start throwaway Postgres for the boot smoke test
        run: |
          docker network create api-smoke
          docker run -d --name api-smoke-db --network api-smoke \
            -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app \
            postgres:16-alpine

      # DATABASE_URL/GCP_PROJECT_ID/FIREBASE_AUTH_EMULATOR_HOST/
      # STORAGE_EMULATOR_HOST/GCS_ATTACHMENTS_BUCKET/VAPID_* mirror
      # e2e/stack.ts's host-process BFF env (see its startAPI for why each
      # one is set the way it is -- same throwaway, documented, non-secret
      # values, not duplicated here). FIREBASE_AUTH_EMULATOR_HOST doesn't
      # need to point at a real emulator any more than STORAGE_EMULATOR_HOST
      # needs a real GCS emulator -- just being set makes the Firebase Admin
      # SDK skip Application Default Credentials discovery at startup,
      # which otherwise blocks main() on a real metadata-server probe with
      # no route to succeed in CI (confirmed the hard way: the first run of
      # this job died in `authn.NewFirebaseVerifier` with "could not find
      # default credentials" before it ever reached the listener). The
      # assertion below is two-part: the container must actually answer on
      # its port with the expected body, and must still be running a
      # couple seconds after that -- not just "docker run returned 0".
      - name: Boot smoke test
        run: |
          docker run -d --name api-smoke --network api-smoke -p 18081:8080 \
            -e "DATABASE_URL=postgres://app:app@api-smoke-db:5432/app?sslmode=disable" \
            -e GCP_PROJECT_ID=doula-cloud \
            -e FIREBASE_AUTH_EMULATOR_HOST=auth-emulator-disabled.invalid:1 \
            -e STORAGE_EMULATOR_HOST=storage-emulator-disabled.invalid:1 \
            -e GCS_ATTACHMENTS_BUCKET=doula-cloud-e2e-unused \
            -e VAPID_PUBLIC_KEY=BEOwHFGQTdwLqgkxPeDzvHQAHjqFkfxMVdO8ONFexrHrD4_43Jvr_XPB5LUA6AAdvnGK1sHeo7WYPwCAOfRI9Ow \
            -e VAPID_PRIVATE_KEY=Vb9fJN9OddK_iRPHqg4We5I2KIcppbZS9_-aoAELXI4 \
            -e VAPID_SUBSCRIBER=mailto:e2e@doula-cloud.invalid \
            doula-cloud-api:ci

          answered=false
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited early:"
              docker logs api-smoke
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18081/hello | grep -q 'hello world'; then
              answered=true
              break
            fi
            sleep 1
          done

          if [ "$answered" != "true" ]; then
            echo "Container never answered on /hello:"
            docker logs api-smoke
            exit 1
          fi

          # Confirm it's still alive after answering, not a one-shot fluke.
          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' api-smoke)" != "true" ]; then
            echo "Container exited after answering:"
            docker logs api-smoke
            exit 1
          fi
          echo "Boot smoke test passed."

  # Applies pending goose migrations to the real doula-cloud-pg Cloud SQL
  # instance via scripts/migrate.sh, gated behind api/app so a red test run
  # never reaches production schema. Only runs on a direct push to trunk --
  # never for pull_request, which would otherwise let any PR touch prod
  # schema before merge.
  #
  # doula-cloud-pg has a public IP, not private-IP-only: this runner has no
  # network route into any GCP VPC, and Cloud SQL private IP is only
  # reachable from inside that VPC (confirmed against Cloud SQL Auth Proxy
  # docs -- a GitHub-hosted runner can't bridge in without a self-hosted
  # runner or a VPC-resident executor, both out of scope for this ticket).
  # The actual security boundary is the Auth Proxy's IAM-gated mutual TLS
  # tunnel through the Cloud SQL Admin API, not network-level ACLs --
  # Authorized Networks is left empty, so raw unproxied connections are
  # refused regardless of source IP.
  migrate:
    needs: [api, app]
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Own concurrency group, no cancel-in-progress -- overrides the
    # workflow-level group above, which would otherwise let a second quick
    # trunk push cancel a migration mid-run against the real instance.
    # Matches firebase-hosting-merge.yml's rationale for the same problem.
    concurrency:
      group: migrate-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Downloaded from Google's documented storage bucket rather than a
      # GitHub release asset -- retried with a 10s gap, matching the
      # actionlint install step above, since both hit a flaky shared-runner
      # download path.
      - name: Install cloud-sql-proxy
        run: |
          for attempt in 1 2 3; do
            if curl -o /usr/local/bin/cloud-sql-proxy -fsSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.25.2/cloud-sql-proxy.linux.amd64; then
              chmod +x /usr/local/bin/cloud-sql-proxy
              exit 0
            fi
            echo "cloud-sql-proxy install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Fetch migration DSN
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            dsn:doula-cloud/doula-cloud-pg-migrate-dsn

      # MIGRATE_DSN is postgres://user:pass@_/dbname -- host/port are
      # unused, since migrate.sh always dials the Auth Proxy on
      # 127.0.0.1:5432, never the DSN's own host.
      - name: Apply migrations
        env:
          MIGRATE_DSN: ${{ steps.secrets.outputs.dsn }}
        run: |
          without_scheme="${MIGRATE_DSN#postgres://}"
          userpass="${without_scheme%%@*}"
          rest="${without_scheme#*@}"
          export DB_USER="${userpass%%:*}"
          export DB_PASS="${userpass#*:}"
          db_name="${rest##*/}"
          export DB_NAME="${db_name%%\?*}"
          export INSTANCE_CONNECTION_NAME=doula-cloud:us-central1:doula-cloud-pg
          ./scripts/migrate.sh

  # Builds api/Dockerfile, pushes it to the `api` Artifact Registry repo
  # (separate from the `cloud-run-source-deploy` repo the earlier manual
  # `gcloud run deploy --source` created), and deploys that image by
  # reference to the existing doula-api Cloud Run service. Gated on
  # `migrate` in addition to the test jobs, so a failed migration blocks
  # the deploy through normal `needs` propagation.
  # api-image is also a needs dep, not just api/app/migrate: it's the job
  # that catches a distroless image compiling and testing clean but failing
  # to boot (missing CA bundle/tzdata) -- that check must gate deploy the
  # same way a failed migration does, not run merely in parallel with it.
  deploy-api:
    needs: [api, app, migrate, api-image]
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Own concurrency group, no cancel-in-progress -- same rationale as
    # `migrate` above: a second quick trunk push must not cancel a deploy
    # that ran after a migration already succeeded, which would leave prod
    # schema ahead of prod code.
    concurrency:
      group: deploy-api-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: us-central1-docker.pkg.dev/doula-cloud/api/doula-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DATABASE_URL is doula-cloud-pg-app-runtime-dsn, shaped as
      # postgres://user:pass@/dbname?host=/cloudsql/INSTANCE&sslmode=disable
      # -- unlike migrate-dsn's placeholder `_` host (dialed through a proxy
      # process instead), the running service has no proxy sidecar and
      # connects straight through the /cloudsql/INSTANCE unix socket that
      # --add-cloudsql-instances mounts into the container.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: doula-api
          region: us-central1
          project_id: doula-cloud
          image: us-central1-docker.pkg.dev/doula-cloud/api/doula-api:${{ github.sha }}
          secrets: DATABASE_URL=doula-cloud-pg-app-runtime-dsn:latest
          flags: --min-instances=1 --add-cloudsql-instances=doula-cloud:us-central1:doula-cloud-pg

      - name: Smoke test deployed revision
        run: |
          url="${{ steps.deploy.outputs.url }}/hello"
          if ! curl -fsS "$url" | grep -q 'hello world'; then
            echo "Deployed revision did not answer on /hello"
            exit 1
          fi
          echo "Deployed revision answered on /hello."

  # Was a standalone workflow (firebase-hosting-app-merge.yml) triggered by
  # its own push+paths filter, so it ran as a separate Actions run with no
  # dependency on api/app passing -- a red test suite couldn't block a live
  # app/ deploy. Folded in here, gated the same way deploy-api is, so both
  # share one needs graph off the same trunk push and a failing test blocks
  # both deploys equally. Runs on every trunk push, unconditional on which
  # paths changed, matching deploy-api's own (also unconditional) behavior.
  deploy-app:
    needs: [api, app]
    if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Own concurrency group, no cancel-in-progress -- same rationale as
    # `migrate`/`deploy-api` above: a second quick trunk push must not
    # cancel a live-site deploy mid-flight.
    concurrency:
      group: deploy-app-${{ github.ref }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build app
        working-directory: app
        run: bun run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-733741680@doula-cloud.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: bunx firebase-tools deploy --only hosting:app --non-interactive

      - name: Smoke test deployed site
        run: |
          if ! curl -fsS https://doula-cloud-app.web.app/ | grep -q 'manifest.webmanifest'; then
            echo "Deployed app/ site did not serve the expected build output"
            exit 1
          fi
          echo "Deployed app/ site answered with the expected build output."
