# Trunk red alarm (#1021, #1639).
#
# Some work runs only on trunk, so a pull request cannot go red on it:
# `CI`'s `migrate`, `deploy-api` and `deploy-app` jobs, and the whole of
# the marketing site's deploy workflow, which also runs when a Practice
# page is published (a `repository_dispatch` with no commit and no pull
# request at all). Trunk is the only place those failures appear, and
# nothing used to announce them. #967 broke `migrate` and trunk stayed
# red across seven merges with no deploy, because every PR in that window
# was green and nobody looked past it.
#
# This turns that silence into an assigned, labeled issue within a minute
# of the failure, and closes it again the moment the same workflow goes
# green, so an open issue is always the live state and not a backlog to
# sift. Each watched workflow has its own issue: `CI` going green does
# not close the one a failed site deploy opened.
#
# The logic is in scripts/trunk-red.ts, with scripts/trunk-red.test.ts
# beside it, and not in this file. `workflow_run` runs from the default
# branch only, so a green pull request proves nothing about this file;
# the `scripts` job, a required check, runs that test.
name: Trunk red

on:
  workflow_run:
    # Matched by each workflow's `name:`. To watch one more workflow that
    # runs on trunk, add its name here; scripts/trunk-red.test.ts fails
    # on a name that no workflow file holds.
    workflows:
      - CI
      - Deploy the marketing site to Firebase Hosting on merge
    types: [completed]
    # A `repository_dispatch` run of a watched workflow has `trunk` as
    # its head branch too, so this filter lets it through.
    branches: [trunk]
  # A replay, which writes nothing: it reads the run with this id from
  # the API and prints to the log what the alarm would do for it. This is
  # how to check the alarm against a real run without a red trunk:
  #   gh workflow run trunk-red.yml -f run_id=<id>
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of a completed workflow run to replay. Nothing is written.
        required: true
        type: string

permissions:
  contents: read
  # The jobs of the watched run, for the failed job and step.
  actions: read
  issues: write
  # A canceled run gets a comment on the pull request named in the commit
  # subject, and a comment on a pull request is refused without this
  # (#1565).
  pull-requests: write

# One group per watched workflow, and a canceled run outside it.
#
# A group holds one run in progress and one queued; a third cancels the
# queued one (#1207). A burst of trunk merges produces a burst of
# canceled `CI` runs, and each of them fires this workflow. In one shared
# group, the queued run that would open the alarm for a real failure
# could be canceled by the event behind it -- a silent red trunk again.
# So a canceled run, which never touches an alarm issue, gets a group of
# its own (its run id). What is left in a workflow's group is its runs
# that passed or failed, in order, and those are minutes apart because
# the watched workflow is itself serialized on trunk.
#
# Two watched workflows are not serialized against each other, and do
# not need to be: they never write to the same issue.
concurrency:
  group: trunk-red-${{ github.event.workflow_run.workflow_id || github.run_id }}-${{ github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.id || 'alarm' }} # spelling:ignore: the value GitHub's API sends
  cancel-in-progress: false

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On `workflow_run` this is the default branch's head, never the
      # code of the run that is watched.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: oven-sh/setup-bun@v2

      - name: Open, update or close the alarm of the workflow that completed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPLAY_RUN_ID: ${{ inputs.run_id }}
        run: bun scripts/trunk-red.ts
