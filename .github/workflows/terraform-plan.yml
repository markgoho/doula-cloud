# Terraform drift check (#1049, closing out #797).
#
# ADR-0034 draws the line: `apply` never runs in CI, only from a laptop as
# markgoho@gmail.com. This job only ever runs `plan`, as the read-only
# `terraform-plan@doula-cloud.iam.gserviceaccount.com` account, over the same
# `github-actions` Workload Identity pool `deploy-api` in ci.yml already
# authenticates through. See docs/infrastructure.md, "Who may apply, and
# what CI may read".
#
# Required check, per the ticket, not an advisory annotation -- and also
# scheduled, because a console change produces no commit and therefore no
# push to trigger anything. Both are true at once, and that has a real cost:
# the first console drift blocks every unrelated pull request until someone
# reconciles it or a maintainer relaxes the ruleset. That trade is recorded,
# not softened here -- see the issue for the reasoning.
name: Terraform Plan

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # Daily, not hourly: #481 is the case this whole effort answers to, and
    # it went unnoticed for three days. Daily keeps reconciling drift a
    # same-day task without running a project this quiet's plan every hour
    # for no signal. 41 past the hour, not on one of the round numbers every
    # other scheduled workflow on GitHub also asks for at the top of the
    # hour (documented cause of scheduled-run delay/skipping under load).
    - cron: '41 9 * * *'
  workflow_dispatch: {}

# Matches ci.yml's own top-level pattern: scoped per ref, not global, so an
# unrelated PR's plan is never queued behind this one. Genuine cross-ref
# contention on the GCS state lock is rare (one person, one project) and is
# already handled by `-lock-timeout` below, which waits instead of erroring.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # GitHub forces GITHUB_TOKEN to read-only, non-OIDC permissions on a
    # pull_request event opened by Dependabot, so id-token: write is
    # unavailable and google-github-actions/auth fails outright -- not a
    # drift finding, just a token Dependabot's own PRs can never mint.
    # Skipping the whole job for that one actor keeps every other trigger
    # (trunk push, a human's PR, the schedule) authenticating and running
    # normally, and it keeps this usable as a required check on Dependabot
    # PRs: GitHub reports a job skipped by its own `if:` as a successful
    # status check, unlike a workflow that never triggers at all (a
    # path/branch filter on `on:`), which would stay pending forever.
    # Verified against #1023, an open Dependabot PR, before relying on it.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # fetch-depth: 0 (full history, all refs) is what the staleness check in
      # the "Terraform plan" step below needs: `git merge-base` against
      # `origin/trunk` requires trunk's history to be present locally, and the
      # default shallow, single-ref checkout does not fetch it (#1203).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project_id: doula-cloud
          workload_identity_provider: projects/850855848778/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: terraform-plan@doula-cloud.iam.gserviceaccount.com

      # terraform_wrapper: false is load-bearing, not cosmetic. The
      # action's default wrapper captures stdout/stderr into step outputs
      # this workflow never reads, and to do that it always exits 0 -- it
      # discards `terraform plan -detailed-exitcode`'s real exit code
      # (documented HashiCorp behavior). Confirmed the hard way: with the
      # wrapper on, a real, live, hand-introduced drift (a Scheduler job's
      # description) planned clean in CI while the identical command
      # planned dirty (exit 2) run locally, unwrapped, against the same
      # state. A required check that cannot fail is worse than none.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.16'
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      # `plan`'s own human-readable stdout is never printed or kept. The
      # original reason was scheduler.tf's nonsensitive() read: a *drifted*
      # X-Internal-Secret header would have printed its actual value in plain
      # text (#1052). #1183 removed that data source with the header, so this
      # configuration reads no secret at all any more -- but the rule stays,
      # because it is cheaper to keep than to re-argue the next time a value
      # worth hiding enters a resource. Every branch below reports the
      # resource address, the action, and which attribute NAMES changed --
      # never a value -- read from `terraform show -json` with jq. The one
      # exception is a genuine command failure (detailed-exitcode 1: e.g. a
      # refresh permission gap), which is not a drift finding and is safe to
      # show in full.
      #
      # `mode == "managed"` keeps any data source out of the drift table.
      # There is none in this configuration since #1183, and the filter is
      # what makes that a fact about today rather than a dependency: a future
      # data source refreshing under `read` can never masquerade as drift on
      # an otherwise-clean project, which is exactly the permanently-red
      # failure ADR-0034 refuses.
      # A non-empty plan on a pull request is not always drift (#1203). A
      # pull_request run's default checkout is GitHub's `refs/pull/<n>/merge`
      # -- a merge commit combining this branch with trunk *as of the last
      # push to this branch*, not live at job-run time. Trunk moving on its
      # own (another PR merging a Terraform change, already applied from a
      # laptop per ADR-0034) does not recompute that ref, so this branch's
      # checkout keeps comparing an old trunk against the live project until
      # something pushes to the branch again. Observed on #1200: cut from
      # `5e968ec9`, #1196 merged and applied afterwards, and every plan on
      # that branch reported drift -- re-running the same job did not help,
      # because it re-fetched the same stale merge ref; rebasing did, because
      # that is a new push. The distinguishing signal doesn't need any data
      # this job doesn't already have: whether trunk's own `terraform/`
      # gained a commit since this branch's last common ancestor with it. If
      # it did, and trunk is what the live project already matches, then this
      # plan's non-emptiness is explained by that alone -- so say so, instead
      # of handing over a drift report and leaving "rebase" for the reader to
      # guess. This does not soften the check: it still fails, because the
      # fix (rebase) is still something only a push accomplishes, but it now
      # says the fix rather than naming resources as if they had drifted.
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_IN_AUTOMATION: 'true'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -lock-timeout=120s -out=tfplan > plan-raw.log 2>&1
          plan_exit=$?
          set -e

          if [ "$plan_exit" -eq 1 ]; then
            echo "terraform plan failed to run (not a drift finding):"
            cat plan-raw.log
            exit 1
          fi

          if [ "$plan_exit" -eq 0 ]; then
            echo "No changes. The live project matches the committed configuration." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          terraform show -json tfplan > plan.json

          drift_table=$(jq -r '
            def changed_keys(b; a):
              (b // {}) as $b | (a // {}) as $a |
              (($b | keys) + ($a | keys) | unique) as $allkeys |
              ($allkeys | map(select($b[.] != $a[.])));

            [.resource_changes[] | select(.mode == "managed" and .change.actions != ["no-op"])] as $drifted
            | ($drifted | length | tostring) + " resource(s) differ from the live project. Attribute NAMES only -- never values, per #1052.\n\n" +
              "| Resource | Action | Changed attributes |\n|---|---|---|\n" +
              ( [ $drifted[]
                  | "| `" + .address + "` | " + (.change.actions | join(",")) + " | " + (changed_keys(.change.before; .change.after) | join(", ")) + " |"
                ] | join("\n") )
          ' plan.json)

          # Only a pull_request checkout can be behind trunk in the way
          # described above -- a push or the daily schedule plans trunk
          # itself, where this comparison is always empty and would only add
          # noise. `working-directory: terraform` scopes the pathspec below
          # to this directory with `-- .`; it is the same check as `--
          # terraform/` from the repo root.
          stale=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet origin trunk || true
            merge_base=$(git merge-base HEAD origin/trunk 2>/dev/null || true)
            if [ -n "$merge_base" ] && [ -n "$(git diff --name-only "$merge_base" origin/trunk -- .)" ]; then
              stale=1
            fi
          fi

          if [ -n "$stale" ]; then
            {
              echo "This branch is behind \`trunk\` on a Terraform change -- not drift."
              echo
              echo "\`trunk\` merged a change under \`terraform/\` after this branch's last common ancestor with it, and that change is already applied to the live project (a laptop \`apply\`, never CI -- see docs/infrastructure.md, \"Who may apply, and what CI may read\"). This plan compares this branch's older configuration against a live project that has already moved on:"
              echo
              git log --oneline "$merge_base"..origin/trunk -- .
              echo
              echo "**Rebase onto \`trunk\` and push.** A rerun alone will not do it -- this checkout is GitHub's \`refs/pull/<n>/merge\`, which only gets recomputed on a new push to this branch. If the plan is still non-empty after the rebase, that is real drift, not staleness."
              echo
              echo "$drift_table"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "This branch is behind trunk on a Terraform change -- rebase onto trunk and push. See the job summary."
            exit 1
          fi

          echo "$drift_table" >> "$GITHUB_STEP_SUMMARY"

          echo "Terraform plan is non-empty -- see the job summary for which resources and attributes drifted."
          exit 1
